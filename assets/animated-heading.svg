<svg xmlns="http://www.w3.org/2000/svg" width="760" height="150" viewBox="0 0 760 150" role="img" aria-labelledby="title desc">
<title id="title">Hi, I'm Joshua</title><desc id="desc">Welcome to my GitHub. Animated blue, purple, and cyan gradient lettering.</desc>
<defs><linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0" stop-color="#3B82F6"><animate attributeName="stop-color" values="#3B82F6;#8B5CF6;#06B6D4;#3B82F6" dur="8s" repeatCount="indefinite"/></stop>
<stop offset=".5" stop-color="#8B5CF6"><animate attributeName="stop-color" values="#8B5CF6;#06B6D4;#3B82F6;#8B5CF6" dur="8s" repeatCount="indefinite"/></stop>
<stop offset="1" stop-color="#06B6D4"><animate attributeName="stop-color" values="#06B6D4;#3B82F6;#8B5CF6;#06B6D4" dur="8s" repeatCount="indefinite"/></stop>
</linearGradient></defs>
<text x="380" y="35" text-anchor="middle" fill="#06B6D4" font-family="Consolas,monospace" font-size="19">&lt; Welcome to my GitHub /&gt;</text>
<text x="380" y="105" text-anchor="middle" fill="url(#flow)" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="700">Hi, I'm Joshua</text>
<path d="M250 133H510" stroke="url(#flow)" stroke-width="2"/>
</svg>